  /barcodes/{code}/lookup:
    get:
      tags:
        - Catalog
      summary: Lookup product by scanned code
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'

