      summary: Get department by ID
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
    patch:
      tags:
        - Organization
      summary: Update department
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
    delete:
      tags:
        - Organization
      summary: Delete department
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'

  /employees:
    get:
      tags:
        - Organization
      summary: List employees
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
    post:
      tags:
        - Organization
      summary: Add employee
      responses:
        '201':
          $ref: '#/components/responses/GenericSuccess'

  /employees/{id}:
    get:
      tags:
        - Organization
      summary: Get employee by ID
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
    patch:
      tags:
        - Organization
      summary: Update employee
      parameters:
        - $ref: '#/components/parameters/id'
