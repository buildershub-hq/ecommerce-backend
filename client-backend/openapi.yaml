  # ---------------------------------------------------------------------------
  # Suppliers
  # ---------------------------------------------------------------------------
  /suppliers:
    get:
      tags:
        - Suppliers
      summary: List suppliers
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
    post:
      tags:
        - Suppliers
      summary: Create supplier
      responses:
        '201':
          $ref: '#/components/responses/GenericSuccess'

  /suppliers/{id}:
    get:
      tags:
        - Suppliers
      summary: Get supplier by ID
      parameters:
        - $ref: '#/components/parameters/id'
