      summary: List branches
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
    post:
      tags:
        - Organization
      summary: Create branch
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          $ref: '#/components/responses/GenericSuccess'

  /branches/{id}:
    get:
      tags:
        - Organization
      summary: Get branch by ID
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
    patch:
      tags:
        - Organization
      summary: Update branch
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
    delete:
      tags:
