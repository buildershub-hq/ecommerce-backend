components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Tenant-scoped JWT Access Token
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Public API Key for external integrations

  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    SignupRequest:
      type: object
      required:
        - fullname
        - email
        - company
        - businnessType
        - password
        - agreed
      properties:
        fullname:
          type: string
          minLength: 2
          maxLength: 255
        email:
          type: string
          format: email
        company:
          type: string
          minLength: 2
          maxLength: 255
        businnessType:
          type: string
          enum:
            - Importers & Exporters
            - Distributors
            - Wholesalers
            - Retail Stores
            - Supermarkets
            - Pharmacies
            - Manufacturing SME
            - Construction Company
            - Estate Developer
            - Agricultural Business
            - Logistics Company
            - Other
        password:
          type: string
          minLength: 8
          description: Min 8 chars, uppercase, lowercase, digit, special character
        agreed:
          type: boolean
          enum: [true]

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        fullname:
          type: string
        company:
          type: string
        businnessType:
          type: string
        agreed:
          type: boolean

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fullname:
          type: string
        email:
          type: string
          format: email
        company:
          type: string
        business_type:
          type: string
        role:
          type: string

    Tokens:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string

    AuthSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/User'
            tokens:
              $ref: '#/components/schemas/Tokens'

    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              nullable: true

  responses:
    GenericSuccess:
      description: Successful operation
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true

    ErrorResponse:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
