  # ---------------------------------------------------------------------------
  # Customers
  # ---------------------------------------------------------------------------
  /customers:
    get:
      tags:
        - Customers
      summary: List customers
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
    post:
      tags:
