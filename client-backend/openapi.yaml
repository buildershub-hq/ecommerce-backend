      summary: List departments
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
    post:
      tags:
        - Organization
      summary: Create department
      responses:
        '201':
          $ref: '#/components/responses/GenericSuccess'

  /departments/{id}:
    get:
      tags:
