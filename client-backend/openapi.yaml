      summary: List products with search/filters
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
    post:
      tags:
        - Catalog
      summary: Create product
      responses:
        '201':
          $ref: '#/components/responses/GenericSuccess'

  /products/{id}:
    get:
      tags:
        - Catalog
      summary: Get product details
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
    patch:
      tags:
        - Catalog
      summary: Update product
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
    delete:
      tags:
        - Catalog
      summary: Delete product
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'

  /products/{id}/variants:
    get:
      tags:
        - Catalog
      summary: List product variants
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
    post:
      tags:
        - Catalog
      summary: Add product variant
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '201':
          $ref: '#/components/responses/GenericSuccess'

  /variants/{id}:
    patch:
      tags:
