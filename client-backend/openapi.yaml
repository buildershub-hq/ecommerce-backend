openapi: 3.0.3
info:
  title: Business Operations Platform - Client Backend API
  description: >
    Business-facing API for the Business Operations Platform, built with Fastify.
    Supports tenant-scoped multi-tenancy, Row-Level Security, JWT authentication,
    and API Key access for public endpoints.
  version: 1.0.0
servers:
  - url: /api/v1
    description: Base API v1 path

security:
  - BearerAuth: []

paths:
  # ---------------------------------------------------------------------------
  # Auth Module
  # ---------------------------------------------------------------------------
  /auth/signup:
    post:
      tags:
        - Auth
      summary: Business signup
      description: Creates tenant, subscription, and owner user. All fields land in the users table.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: Created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

  /auth/login:
    post:
      tags:
        - Auth
      summary: User login
      description: Issues access token and refresh token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Refresh access token
      description: Rotates access token using a valid refresh token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      tokens:
                        $ref: '#/components/schemas/Tokens'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'

  /auth/logout:
    post:
      tags:
        - Auth
      summary: Log out user
      description: Revokes/invalidates current refresh token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /auth/forgot-password:
    post:
      tags:
        - Auth
      summary: Request password reset email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'

  /auth/reset-password:
    post:
      tags:
        - Auth
      summary: Reset password with token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - newPassword
              properties:
                token:
                  type: string
                newPassword:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'

  /auth/verify-email:
    post:
      tags:
        - Auth
      summary: Confirm email verification token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'

  /auth/mfa/enable:
    post:
      tags:
        - Auth
      summary: Enroll MFA for current user
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'

  /auth/mfa/verify:
    post:
      tags:
        - Auth
      summary: Verify MFA code at login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - mfaToken
              properties:
                code:
                  type: string
                mfaToken:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'

  /auth/me:
    get:
      tags:
        - Auth
      summary: Get current user profile
      description: Returns current user details, tenant information, and permissions.
      responses:
        '200':
          description: User info
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/ErrorResponse'

  # ---------------------------------------------------------------------------
  # Organization Module
  # ---------------------------------------------------------------------------
  /organization/profile:
